name: Bug Report
description: Report a bug, a crash, a NaN or an out-of-memory you did not expect
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill in the details below. English only.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened? What did you expect to happen?
      placeholder: Describe the bug...
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The exact command and the config it ran (the generated `config.py` of the run, or your config file).
      placeholder: |
        1. kohakumoss-config new train --vram 24 --algo lora ...
        2. kogine run scripts/train/moss.py --config my_run.py
        3. Observe that...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or error messages
      description: The run's log from the start (the build, memory plan and prewarm lines matter), plus the traceback.
      render: text

  - type: textarea
    id: doctor
    attributes:
      label: kohakumoss-doctor output
      description: Output of `kohakumoss-doctor` on the machine that ran it (GPU, arch, backends, toolchain).
      render: text
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Training (LoRA / LyCORIS adapters)
        - Training (full finetune)
        - Memory profiles / offload
        - Multi-GPU (DDP / FSDP2 / pipeline / threaded)
        - Kernels / tuning
        - Data / caches
        - Sampling / grid / export
        - Config CLI (kohakumoss-config)
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `pip show kohakumoss` (or the git commit you installed from)
      placeholder: "0.1.0"
    validations:
      required: true

  - type: input
    id: gpu
    attributes:
      label: GPU and VRAM
      placeholder: "RTX 4090 24 GB (sm89)"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: OS, Python and torch versions
      placeholder: "Windows 11 / Ubuntu 24.04, Python 3.12, torch 2.14.1+cu130"
    validations:
      required: true
